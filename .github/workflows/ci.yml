name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and package skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain CI pipeline
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`CI trigger: ${context.eventName}; ref: ${context.ref}; commit: ${context.sha}`);
            core.info('Stages: install dependencies, run tests, verify skill bundles, run install smoke checks, and verify release/Node compatibility.');
            const release = context.eventName === 'push' && context.ref.startsWith('refs/tags/v');
            core.notice(release ? 'Release dispatch will run only after every CI check passes.' : 'Release dispatch is skipped: this is not a push of a v-prefixed release tag.');

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        run: bun install

      - name: Run Bun test suite
        id: tests
        run: bun test

      - name: Verify skill reference bundles
        id: references
        run: make skills-sync-check

      - name: Run install smoke checks
        id: smoke
        run: make install-smoke

      - name: Verify release version sync
        id: release
        run: make release-check

      - name: Validate Node runner compatibility
        id: node_smoke
        run: npm run install:smoke:node

      - name: Verify Node release sync compatibility
        id: node_release
        run: npm run release:check:node

      - name: Summarize CI stages
        if: always()
        uses: actions/github-script@v7
        env:
          STAGES: >-
            {"Checkout":"${{ steps.checkout.outcome }}","Bun setup":"${{ steps.bun.outcome }}","Node setup":"${{ steps.node.outcome }}","Dependency install":"${{ steps.install.outcome }}","Tests":"${{ steps.tests.outcome }}","Reference bundles":"${{ steps.references.outcome }}","Install smoke":"${{ steps.smoke.outcome }}","Release version":"${{ steps.release.outcome }}","Node install smoke":"${{ steps.node_smoke.outcome }}","Node release sync":"${{ steps.node_release.outcome }}"}
        with:
          script: |
            const stages = Object.entries(JSON.parse(process.env.STAGES));
            for (const [name, outcome] of stages) core.info(`${name}: ${outcome || 'not run'}`);
            const passed = stages.every(([, outcome]) => outcome === 'success');
            const release = context.eventName === 'push' && context.ref.startsWith('refs/tags/v');
            const next = !passed ? 'CI did not complete successfully. Release dispatch is blocked; inspect failed/cancelled stages. Later checks are skipped after a failure.' : release ? 'CI passed. The dispatch-release job will request Release; dispatch does not prove publication succeeded.' : 'CI passed. Release dispatch is skipped because this is not a push of a v-prefixed release tag.';
            core.notice(next);
            await core.summary.addHeading('CI pipeline').addTable([
              [{data: 'Stage', header: true}, {data: 'Outcome', header: true}],
              ...stages.map(([name, outcome]) => [name, outcome || 'not run'])
            ]).addRaw(`\n${next}\n`).write();

  dispatch-release:
    name: Dispatch release for release tag
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release workflow
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: tag,
              inputs: {
                tag,
                sha: context.sha,
                force_release: 'false'
              }
            });
            core.info(`Dispatched release.yml for ${tag} at ${context.sha}`);

      - name: Summarize release dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/release.yml`;
            const next = process.env.DISPATCH_OUTCOME === 'success' ? 'Dispatch accepted. Open Release workflow runs to verify publication and marketplace update; dispatch does not return a run ID.' : 'Release dispatch did not succeed. Inspect this job and retry after resolving the error.';
            core.notice(`${next} ${url}`);
            await core.summary.addHeading('Release dispatch').addTable([
              [{data: 'Stage', header: true}, {data: 'Outcome', header: true}],
              ['Dispatch Release', process.env.DISPATCH_OUTCOME || 'not run']
            ]).addRaw(`\n${next}\n`).addLink('Release workflow runs', url).write();
