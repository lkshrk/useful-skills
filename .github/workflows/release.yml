name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      sha:
        description: "Commit SHA to release. Defaults to the tag target."
        required: false
        type: string
      force_release:
        description: "Skip CI-success validation for the release commit."
        required: false
        default: false
        type: boolean
      summary:
        description: "Optional change summary prepended to the release notes."
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      REQUESTED_SHA: ${{ inputs.sha }}
      FORCE_RELEASE: ${{ inputs.force_release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Explain release pipeline
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`Release target: ${process.env.TAG}; requested commit: ${process.env.REQUESTED_SHA || 'resolve from tag'}`);
            core.info('Stages: resolve tag, verify CI, validate package, prepare notes, verify marketplace update path, publish release, upload ZIPs, update marketplace.');
            if (process.env.FORCE_RELEASE === 'true') {
              core.warning('CI-success validation is skipped because force_release=true was explicitly supplied. Package validation and smoke checks still run.');
            } else {
              core.notice('CI gate enabled: publication requires a successful CI run for the resolved commit.');
            }

      - name: Check out release tag
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release commit
        id: release_commit
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA}"
          if [ -z "$sha" ]; then
            sha="$(git rev-list -n 1 "$TAG")"
          fi
          tag_sha="$(git rev-list -n 1 "$TAG")"
          if [ "$sha" != "$tag_sha" ]; then
            echo "Requested SHA $sha does not match $TAG target $tag_sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag $TAG to commit $sha"

      - name: Verify CI succeeded for release commit
        id: ci_gate
        if: ${{ !inputs.force_release }}
        run: |
          set -euo pipefail
          sha="${{ steps.release_commit.outputs.sha }}"
          count="$(gh run list --workflow "CI" --commit "$sha" --status completed --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$count" -lt 1 ]; then
            echo "No successful CI run found for $sha. Re-run CI or dispatch with force_release=true." >&2
            exit 1
          fi
          echo "Found $count successful CI run(s) for $sha; release CI gate passed"

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        run: bun install

      - name: Verify release version sync
        id: version
        run: |
          make marketplace-generate
          bun scripts/verify_release.ts --tag "$TAG" --marketplace-dir dist/marketplace

      - name: Run install smoke checks
        id: smoke
        run: make install-smoke

      - name: Build release notes
        id: notes
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          if [ -n "$SUMMARY" ]; then
            printf '## Changes\n\n%s\n\n' "$SUMMARY" > release-notes.md
          fi
          cat >> release-notes.md <<EOF
          ## Install

          \`\`\`sh
          npx skills add ${{ github.repository }}
          npx skills add ${{ github.repository }} --agent codex --agent claude-code
          \`\`\`

          ## Verify

          \`\`\`sh
          npx skills add ${{ github.repository }} --list
          \`\`\`
          EOF

      - name: Verify marketplace update path
        id: marketplace_check
        env:
          MARKETPLACE_PUSH_TOKEN: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$MARKETPLACE_PUSH_TOKEN" ]; then
            echo "MARKETPLACE_PUSH_TOKEN is configured"
            exit 0
          fi

          codex_ref="$(curl -fsSL https://raw.githubusercontent.com/lkshrk/agent-marketplace/main/.agents/plugins/marketplace.json | jq -r '.plugins[] | select(.name == "useful-skills") | .source.ref')"
          claude_ref="$(curl -fsSL https://raw.githubusercontent.com/lkshrk/agent-marketplace/main/.claude-plugin/marketplace.json | jq -r '.plugins[] | select(.name == "useful-skills") | .source.ref')"
          claude_version="$(curl -fsSL https://raw.githubusercontent.com/lkshrk/agent-marketplace/main/.claude-plugin/marketplace.json | jq -r '.plugins[] | select(.name == "useful-skills") | .version')"
          version="${TAG#v}"

          if [ "$codex_ref" = "$TAG" ] && [ "$claude_ref" = "$TAG" ] && [ "$claude_version" = "$version" ]; then
            echo "MARKETPLACE_PUSH_TOKEN is missing, but marketplace is already current for $TAG"
            exit 0
          fi

          echo "MARKETPLACE_PUSH_TOKEN secret is required to update lkshrk/agent-marketplace" >&2
          exit 1

      - name: Create or update GitHub release
        id: publish
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub release for $TAG"
            gh release edit "$TAG" \
              --title "useful-skills $TAG" \
              --notes-file release-notes.md
          else
            echo "Creating GitHub release for $TAG"
            gh release create "$TAG" \
              --verify-tag \
              --title "useful-skills $TAG" \
              --notes-file release-notes.md
          fi

      - name: Attach per-skill ZIPs for chat app uploads
        id: assets
        run: |
          set -euo pipefail
          make skill-zips
          gh release upload "$TAG" dist/skills/*.zip --clobber
          echo "Per-skill ZIP uploads completed for $TAG"

      - name: Bump marketplace useful-skills version
        id: marketplace
        env:
          MARKETPLACE_PUSH_TOKEN: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MARKETPLACE_PUSH_TOKEN" ]; then
            echo "MARKETPLACE_PUSH_TOKEN is missing; marketplace was verified current earlier"
            exit 0
          fi
          bun scripts/publish_marketplace.ts \
            --version "$TAG" \
            --marketplace-repo "https://x-access-token:${MARKETPLACE_PUSH_TOKEN}@github.com/lkshrk/agent-marketplace.git" \
            --push

      - name: Summarize release stages
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          STAGES: >-
            {"Checkout":"${{ steps.checkout.outcome }}","Resolve commit":"${{ steps.release_commit.outcome }}","CI gate":"${{ steps.ci_gate.outcome }}","Bun setup":"${{ steps.bun.outcome }}","Node setup":"${{ steps.node.outcome }}","Dependency install":"${{ steps.install.outcome }}","Version validation":"${{ steps.version.outcome }}","Install smoke":"${{ steps.smoke.outcome }}","Release notes":"${{ steps.notes.outcome }}","Marketplace preflight":"${{ steps.marketplace_check.outcome }}","Publish release":"${{ steps.publish.outcome }}","Upload ZIPs":"${{ steps.assets.outcome }}","Marketplace update or already-current check":"${{ steps.marketplace.outcome }}"}
        with:
          script: |
            const stages = Object.entries(JSON.parse(process.env.STAGES));
            for (const [name, outcome] of stages) core.info(`${name}: ${outcome || 'not run'}`);
            const forced = process.env.FORCE_RELEASE === 'true';
            const published = stages.find(([name]) => name === 'Publish release')[1] === 'success';
            const complete = stages.every(([name, outcome]) => outcome === 'success' || (name === 'CI gate' && forced && outcome === 'skipped'));
            const next = complete ? 'Release pipeline completed, including asset uploads and marketplace update/current-version check.' : published ? 'GitHub release was published, but the pipeline is incomplete. Inspect failed/cancelled stages; assets or marketplace may still need updating. Rerunning updates the existing release.' : 'Release publication did not complete successfully. Inspect failed/cancelled stages before retrying; later stages are skipped after a failure.';
            core.notice(next);
            core.summary.addHeading('Release pipeline').addTable([
              [{data: 'Stage', header: true}, {data: 'Outcome', header: true}],
              ...stages.map(([name, outcome]) => [name, name === 'CI gate' && forced && outcome === 'skipped' ? 'skipped: force_release=true' : outcome || 'not run'])
            ]).addRaw(`\n${next}\n`).addRaw(`\nResolved commit: ${process.env.RELEASE_SHA || 'not resolved'}\n`);
            if (published) {
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/${encodeURIComponent(process.env.TAG)}`;
              core.info(`GitHub release: ${url}`);
              core.summary.addLink('GitHub release', url);
            }
            await core.summary.write();
