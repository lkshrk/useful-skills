name: WoW seasonal bundle refresh

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC; avoid the busy start of the hour.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Recheck recommendations even when source fingerprints are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wow-season-source-check
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      candidate_ready: ${{ steps.refresh.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Find affected sources
        id: inspect
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: |
          python3 scripts/check_wow_season_updates.py --json > wow-source-observation.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from check_wow_season_updates import report
          data = json.load(open('wow-source-observation.json'))
          data['force_refresh'] = os.environ['FORCE_REFRESH'] == 'true'
          with open('wow-source-observation.json', 'w') as out:
              json.dump(data, out, indent=2)
          needed = data['requires_refresh'] or data['force_refresh']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('needed=' + str(needed).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(report(data['rows'], data['current']))
          PY

      - name: Preserve trusted source observations
        uses: actions/upload-artifact@v7
        with:
          name: wow-source-observation
          path: wow-source-observation.json
          retention-days: 30
          if-no-files-found: error

      - name: Configure refresh provider
        if: steps.inspect.outputs.needed == 'true'
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WOW_REFRESH_BASE_URL: ${{ vars.WOW_REFRESH_BASE_URL }}
          WOW_REFRESH_MODEL: ${{ vars.WOW_REFRESH_MODEL }}
          WOW_REFRESH_GATEWAY_KEY: ${{ secrets.WOW_REFRESH_API_KEY }}
        run: python3 scripts/configure_wow_refresh_provider.py >> "$GITHUB_OUTPUT"

      - name: Refresh affected setup records with Codex
        if: steps.inspect.outputs.needed == 'true'
        id: refresh
        uses: openai/codex-action@v1
        env:
          WOW_REFRESH_GATEWAY_KEY: ${{ steps.provider.outputs.mode == 'gateway' && secrets.WOW_REFRESH_API_KEY || '' }}
        with:
          openai-api-key: ${{ steps.provider.outputs.mode == 'openai' && secrets.OPENAI_API_KEY || '' }}
          prompt-file: .github/codex/prompts/refresh-wow-season.md
          output-file: wow-refresh-result.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ steps.provider.outputs.model }}
          codex-args: ${{ steps.provider.outputs.codex_args }}

      # Only data is exported from the agent's runner; publishing uses a fresh job.
      - name: Keep candidate data
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: wow-refresh-candidate
          path: skills/wow-spec/assets/season-data/retail/season-mn-2/
          retention-days: 30
          if-no-files-found: error

      - name: Keep refresh result
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: wow-refresh-result
          path: wow-refresh-result.json
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: refresh
    if: needs.refresh.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
      BUNDLE_DIR: skills/wow-spec/assets/season-data/retail/season-mn-2
      STAGING_BRANCH: automation/wow-season-refresh
      AUTO_RELEASE: ${{ vars.WOW_AUTO_RELEASE != 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.refresh.outputs.base_sha }}

      - name: Download candidate data
        uses: actions/download-artifact@v8
        with:
          name: wow-refresh-candidate
          path: ${{ runner.temp }}/wow-candidate

      - name: Download source observations
        uses: actions/download-artifact@v8
        with:
          name: wow-source-observation
          path: ${{ runner.temp }}/wow-observation

      - name: Download refresh result
        uses: actions/download-artifact@v8
        with:
          name: wow-refresh-result
          path: ${{ runner.temp }}/wow-result

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and apply data-only changes
        id: apply
        run: |
          python3 scripts/apply_wow_season_refresh.py \
            --candidate "$RUNNER_TEMP/wow-candidate" \
            --result "$RUNNER_TEMP/wow-result/wow-refresh-result.json" \
            --observation "$RUNNER_TEMP/wow-observation/wow-source-observation.json" \
            > "$RUNNER_TEMP/wow-apply.json"
          cat "$RUNNER_TEMP/wow-apply.json"
          echo "release=$(jq -r '.release' "$RUNNER_TEMP/wow-apply.json")" >> "$GITHUB_OUTPUT"
          jq -r '.summary' "$RUNNER_TEMP/wow-apply.json" > "$RUNNER_TEMP/wow-summary.md"
          bun test
          git diff --check

      - name: Commit refresh on staging branch
        id: stage
        env:
          RELEASE: ${{ steps.apply.outputs.release }}
        run: |
          git add -- "$BUNDLE_DIR"
          if git diff --cached --quiet; then
            echo "No bundle changes to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=""
          if [ "$RELEASE" = "true" ]; then
            git commit -m "fix(wow): refresh seasonal setup bundle"
            if [ "$AUTO_RELEASE" = "true" ]; then
              bun scripts/create_release.ts patch
              tag="$(git describe --tags --exact-match HEAD)"
            fi
          else
            git commit -m "chore(wow): advance seasonal source fingerprints"
            echo "Only source fingerprints changed; no recommendation update, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "pushed=true"
          } >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so CI is dispatched explicitly.
      - name: Run CI on staged commit
        if: steps.stage.outputs.pushed == 'true'
        env:
          SHA: ${{ steps.stage.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$STAGING_BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "CI run for $SHA did not start." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 20

      - name: Open pull request (auto-release disabled)
        if: steps.stage.outputs.pushed == 'true' && env.AUTO_RELEASE != 'true'
        run: |
          if [ -z "$(gh pr list --head "$STAGING_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$STAGING_BRANCH" \
              --title "chore(wow): seasonal bundle refresh" --body-file "$RUNNER_TEMP/wow-summary.md"
          fi
          echo "WOW_AUTO_RELEASE=false: opened a pull request; release manually after merging." >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward default branch
        if: steps.stage.outputs.pushed == 'true' && env.AUTO_RELEASE == 'true'
        run: |
          git fetch origin "refs/heads/$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "Default branch moved during refresh. Candidate kept on $STAGING_BRANCH; rerun rather than overwrite newer work." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          git push origin --delete "$STAGING_BRANCH"
          echo "Updated the bundled WoW setup data on $DEFAULT_BRANCH." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish patch release
        if: steps.stage.outputs.tag != '' && env.AUTO_RELEASE == 'true'
        env:
          TAG: ${{ steps.stage.outputs.tag }}
          SHA: ${{ steps.stage.outputs.sha }}
        run: |
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f sha="$SHA" -f force_release=false \
            -f summary="$(cat "$RUNNER_TEMP/wow-summary.md")"
          echo "Dispatched release $TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize applied refresh
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'wow-result/wow-refresh-result.json')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n## AI refresh: ' + data['status'] + '\n\n' + data['summary'] + '\n')
              if data['unresolved_sources']:
                  out.write('\nUnresolved sources (previous values retained):\n')
                  out.writelines('- ' + url + '\n' for url in data['unresolved_sources'])
          PY
